; ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM)
;  - COM-poort (USB-serieel chip): flashen en log
;  - native USB-poort: config-schijfje (config.txt) + tweede log
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_unflags =
    -DARDUINO_USB_MODE=1
    ; anders bouwt JPEGDEC zijn SIMD-assembler, die esp-dsp-headers nodig heeft
    -DARDUINO_ESP32S3_DEV
build_flags =
    ; ARDUINO_USB_MODE=0: TinyUSB, zodat de native poort CDC + massaopslag kan bieden
    ; ARDUINO_USB_CDC_ON_BOOT=0: Serial = COM-poort
    ; NO_SIMD: de SIMD-route van JPEGDEC vereist esp-dsp-headers; C is snel genoeg
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DNO_SIMD
lib_deps =
    bitbank2/JPEGDEC@^1.8
    bblanchon/ArduinoJson@^7
monitor_speed = 115200
